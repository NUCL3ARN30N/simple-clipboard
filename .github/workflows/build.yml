name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION"
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version='$VERSION';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          node -e "const f='package.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version='$VERSION';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist
          BUNDLE=src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp "$BUNDLE"/deb/*.deb "dist/simple-clipboard_${VERSION}_amd64.deb"
          else
            cp "$BUNDLE"/nsis/*-setup.exe "dist/SimpleClipboard_${VERSION}_x64-setup.exe"
            cp "$BUNDLE"/msi/*.msi "dist/SimpleClipboard_${VERSION}_x64.msi"
            PORTABLE="SimpleClipboard_${VERSION}_x64_portable"
            mkdir -p "$PORTABLE"
            cp src-tauri/target/release/simple-clipboard.exe "$PORTABLE/SimpleClipboard.exe"
            echo "Data is stored in the 'data' folder next to the executable. Delete this file to use %APPDATA% instead." > "$PORTABLE/portable"
            pwsh -Command "Compress-Archive -Path '$PORTABLE/*' -DestinationPath 'dist/$PORTABLE.zip'"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: simple-clipboard-${{ runner.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
